<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDdemo · 三维针尖扫描</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1320;color:#dfebf6;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}header{padding:22px 28px;border-bottom:1px solid #263447;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}small,.muted{color:#90a5bd}main{display:grid;grid-template-columns:280px 1fr;gap:18px;padding:20px}aside,.panel{background:#111e2e;border:1px solid #26384e;border-radius:12px;padding:18px}label{display:block;margin:16px 0 7px}select,input,button{font:inherit;border:1px solid #39516c;border-radius:6px;background:#192c42;color:#e6f1ff;padding:9px}select{width:100%}input[type=range]{width:100%;padding:0}button{cursor:pointer}button:hover{background:#294a66}button.primary{background:#087c91}button:disabled{opacity:.4;cursor:default}.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}.view{height:480px;width:100%;display:block;touch-action:none}.sub{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.sub canvas{width:100%;height:220px;display:block}.badge{color:#5de0cb}.stats{display:flex;gap:25px;padding:12px 0;color:#8ce2e8;flex-wrap:wrap}progress{width:100%;accent-color:#5de0cb}h2{font-size:14px;margin:0 0 10px}.note{line-height:1.7;font-size:12px;color:#9eb1c8}#status{min-height:45px;line-height:1.6;margin:12px 0;overflow-wrap:anywhere}@media(max-width:900px){main{grid-template-columns:1fr}.sub{grid-template-columns:1fr}.view{height:360px}}
</style>
<header><div><h1>TDdemo <span class="badge">/ 三维针尖扫描</span></h1><small>TERS-DriftLab · Geometry & scanning prototype</small></div><small>拖动旋转 · 滚轮缩放</small></header>
<main><aside><h2>样品与扫描设置</h2><label>内置表面</label><select id="sample"><option value="mixed">凸起、凹坑与平面</option><option value="step">台阶表面</option><option value="flat">平坦表面</option></select>
<label>导入坐标单位（导入前选择）</label><select id="unit"><option value="A">Å / 埃（PDB 默认）</option><option value="nm">nm / 纳米</option></select><div class="row"><button id="import">导入 PDB / XYZ</button></div><input hidden type="file" id="file" accept=".pdb,.xyz">
<label>尖端半径 R <span id="rv"></span></label><input id="radius" type="range" min="0.4" max="4" step="0.1" value="1.2">
<label>垂直抬升量 g <span id="gv"></span></label><input id="gap" type="range" min="0.1" max="2" step="0.1" value="0.5">
<label>扫描分辨率</label><select id="resolution"><option>24</option><option selected>40</option><option>64</option></select>
<label>扫描路径</label><select id="mode"><option value="snake">蛇形 / 双向扫描</option><option value="raster">逐行 / 回扫不采样</option></select>
<label>播放速度 <span id="sv"></span></label><input id="speed" type="range" min="10" max="240" value="80">
<div class="row"><button id="start" class="primary">开始扫描</button><button id="reset">重置</button></div><div class="row"><button id="export">导出 JSON</button><button id="camera">恢复视角</button></div>
<p id="status"></p><progress id="progress" max="1" value="0"></progress><p class="note">球形针尖在离散高度场上理想跟随。g 是几何包络后的垂直抬升量，不等于所有位置的最小法向间隙。当前版本不生成拉曼谱、不模拟漂移或真实反馈动力学。</p></aside>
<section><div class="panel"><h2 id="title">三维样品与针尖</h2><canvas id="scene" class="view"></canvas><div class="stats"><span id="position">位置：—</span><span id="count">采样：0</span><span id="time">仿真时间：0 s</span></div><small>青色：表面高处 · 金色：球形尖端 · 白色：已采样路径 · 坐标单位 nm</small></div>
<div class="sub"><div class="panel"><h2>逐点构建的扫描形貌（针尖高度 − g）</h2><canvas id="map"></canvas></div><div class="panel"><h2>当前扫描行：表面与针尖高度</h2><canvas id="profile"></canvas><small>青色：表面高度　金色：针尖最低点</small></div></div></section></main>
<script src="model.js"></script><script src="app.js"></script></html>
